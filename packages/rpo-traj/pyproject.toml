[project]
name = "rpo-traj"
version = "0.1.0"
description = "Flagship 1: RPO trajectory design and validation."
requires-python = ">=3.11,<3.13"
dependencies = ["rpo-core"]

[project.optional-dependencies]
viz = ["matplotlib>=3.9"]

[project.scripts]
rpo-traj = "rpo_traj.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpo_traj"]

[tool.hatch.build.targets.wheel.force-include]
"src/rpo_traj/py.typed" = "rpo_traj/py.typed"

[tool.uv.sources]
rpo-core = { workspace = true }
