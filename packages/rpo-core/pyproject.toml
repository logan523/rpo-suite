[project]
name = "rpo-core"
version = "0.1.0"
description = "Shared astrodynamics core: frames, propagators, relative motion, constraints, metrics."
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=2.0", "scipy>=1.14", "pydantic>=2.8", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpo_core"]

# PEP 561: ship the marker so downstream packages inherit the strict type information
# instead of silently degrading every rpo_core import to Any.
[tool.hatch.build.targets.wheel.force-include]
"src/rpo_core/py.typed" = "rpo_core/py.typed"
