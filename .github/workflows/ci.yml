name: fast-suite

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        # --extra viz is required: without it the plotting tests skip and that layer
        # goes untested, which is how a gate quietly stops gating.
        run: uv sync --locked --extra viz --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --extra viz ruff check .

      - name: Format check
        run: uv run --extra viz ruff format --check .

      - name: Type check
        run: uv run --extra viz mypy

      - name: Tests
        run: uv run --extra viz pytest -q -m "not slow" --cov=rpo_core --cov=rpo_traj --cov-report=term-missing

      - name: Assert no tests were silently skipped
        # A skipped plotting suite looks identical to a passing one in the summary
        # line. Fail loudly instead.
        run: uv run --extra viz pytest -q -m "not slow" --no-header -rs 2>&1 | tee /tmp/out.txt && ! grep -qE "[0-9]+ skipped" /tmp/out.txt
